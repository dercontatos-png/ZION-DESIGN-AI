<!DOCTYPE html>
<html>
<head>
<style>
  .outer {
    width: 800px;
    height: 300px;
    background: #222;
    display: flex;
    position: relative;
    overflow: hidden;
  }
  .inner {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
  }
  img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
  }
</style>
</head>
<body>
  <div class="outer">
    <div class="inner">
      <img src="https://via.placeholder.com/1920x1080">
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; font-family: sans-serif; }
    video { max-width: 90vw; max-height: 80vh; }
    .controls { margin-top: 10px; display: flex; gap: 10px; }
    button { padding: 8px 16px; background: #333; color: white; border: 1px solid #666; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <video id="v" src="/demo.mp4" controls autoplay muted></video>
  <div class="controls">
    <button onclick="document.getElementById('v').currentTime = 2">2s</button>
    <button onclick="document.getElementById('v').currentTime = 5">5s</button>
    <button onclick="document.getElementById('v').currentTime = 10">10s</button>
    <button onclick="document.getElementById('v').currentTime = 15">15s</button>
    <button onclick="document.getElementById('v').currentTime = 20">20s</button>
    <button onclick="document.getElementById('v').currentTime = 30">30s</button>
  </div>
</body>
</html>

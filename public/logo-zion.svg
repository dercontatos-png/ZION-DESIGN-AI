<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="540" height="100" fill="none">
  <defs>
    <linearGradient id="zionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>

  <!-- Modern Icon Box -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#zionGrad)" />
    <!-- Geometric Z Monogram -->
    <path d="M24 26 H56 L31 54 H56" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="26" cy="54" r="3.5" fill="#FFFFFF" />
    <circle cx="54" cy="26" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography -->
  <text x="108" y="56" fill="url(#textGrad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="3">ZION</text>

  <!-- DESIGN Badge -->
  <g transform="translate(255, 23)">
    <rect x="0" y="0" width="138" height="36" rx="8" fill="#8B5CF6" fill-opacity="0.18" stroke="#8B5CF6" stroke-width="1.8" />
    <text x="69" y="24" fill="#C4B5FD" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="17" letter-spacing="3" text-anchor="middle">DESIGN</text>
  </g>

  <!-- Studio AI Pro Tagline -->
  <text x="110" y="78" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" letter-spacing="4">STUDIO AI PRO</text>
</svg>
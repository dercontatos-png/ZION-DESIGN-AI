  <script>
    // State & Interactive Logic
    let currentDimension = "1:1";
    let currentQuality = "1K";
    let currentAlignment = "center";
    let mainImageBase64 = null;
    let refImageBase64 = null;
    let isFavorited = false;
    let fsZoom = 100;

    function showToast(msg, type = 'info') {
      const container = document.getElementById('db-toast-container');
      const toast = document.createElement('div');
      toast.className = 'db-toast db-toast-' + type;
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-10px)';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function downloadCurrentViewer(format) {
      const img = document.getElementById('main-result-viewer');
      if (!img || !img.src) return;
      const link = document.createElement('a');
      link.href = img.src;
      link.download = 'design-builder-' + Date.now() + '.' + format;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('Download iniciado em ' + format.toUpperCase(), 'success');
    }

    // 1. Dimension Buttons
    document.querySelectorAll('.dim-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.dim-btn').forEach(b => {
          b.setAttribute('aria-pressed', 'false');
          b.classList.remove('pb-ctrl-active', 'text-white');
          b.classList.add('text-zinc-500');
          const span = b.querySelector('span[aria-hidden="true"]');
          if (span) {
            span.className = 'block rounded-[3px] border border-zinc-600 bg-white/[0.025]';
          }
        });
        btn.setAttribute('aria-pressed', 'true');
        btn.classList.add('pb-ctrl-active', 'text-white');
        btn.classList.remove('text-zinc-500');
        const span = btn.querySelector('span[aria-hidden="true"]');
        if (span) {
          span.className = 'block rounded-[3px] border border-violet-300 bg-violet-400/20';
        }
        currentDimension = btn.getAttribute('data-dim');
        updateResLabel();
      });
    });

    // 2. Quality Buttons
    document.querySelectorAll('.quality-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.quality-btn').forEach(b => {
          b.setAttribute('aria-pressed', 'false');
          b.style.background = 'linear-gradient(rgba(16, 10, 40, 0.4), rgba(10, 7, 28, 0.5)) padding-box padding-box, linear-gradient(135deg, rgba(139, 92, 246, 0.08), rgba(139, 92, 246, 0.027)) border-box border-box';
          b.style.border = '1px solid transparent';
          b.style.boxShadow = 'none';
          b.querySelectorAll('span').forEach(s => {
            s.style.color = 'rgb(161, 161, 170)';
          });
        });
        btn.setAttribute('aria-pressed', 'true');
        btn.style.background = 'linear-gradient(rgba(30, 16, 70, 0.6), rgba(20, 10, 50, 0.7)) padding-box padding-box, linear-gradient(135deg, rgba(139, 92, 246, 0.447), rgba(139, 92, 246, 0.12) 50%, rgba(139, 92, 246, 0.28)) border-box border-box';
        btn.style.border = '1px solid transparent';
        btn.style.boxShadow = 'rgba(139, 92, 246, 0.19) 0px 0px 12px, rgba(139, 92, 246, 0.07) 0px 0px 28px';
        btn.querySelectorAll('span').forEach(s => {
          s.style.color = 'rgb(255, 255, 255)';
        });
        currentQuality = btn.getAttribute('data-quality');
        updateResLabel();
      });
    });

    function updateResLabel() {
      const label = document.getElementById('quality-res-label');
      let base = 1024;
      if (currentQuality === '2K') base = 2048;
      if (currentQuality === '4K') base = 4096;
      if (currentDimension === '1:1') label.textContent = base + '×' + base;
      else if (currentDimension === '4:5') label.textContent = Math.round(base * 0.8) + '×' + base;
      else if (currentDimension === '9:16') label.textContent = Math.round(base * 0.5625) + '×' + base;
      else if (currentDimension === '16:9') label.textContent = base + '×' + Math.round(base * 0.5625);
    }

    // 3. Alignment Buttons
    const alignLeft = document.getElementById('align-left');
    const alignCenter = document.getElementById('align-center');
    const alignRight = document.getElementById('align-right');
    function setAlign(align) {
      currentAlignment = align;
      [alignLeft, alignCenter, alignRight].forEach(b => {
        b.className = 'flex h-7 w-7 items-center justify-center rounded-md border transition-colors border-white/10 bg-white/[0.04] text-zinc-500 hover:border-white/20 hover:text-zinc-300';
        b.setAttribute('aria-pressed', 'false');
      });
      const active = align === 'left' ? alignLeft : (align === 'right' ? alignRight : alignCenter);
      active.className = 'flex h-7 w-7 items-center justify-center rounded-md border transition-colors border-violet-500/60 bg-violet-500/25 text-violet-200';
      active.setAttribute('aria-pressed', 'true');
    }
    alignLeft.onclick = () => setAlign('left');
    alignCenter.onclick = () => setAlign('center');
    alignRight.onclick = () => setAlign('right');

    // 4. File uploads (Sujeito, Ref, Asset)
    const inputFileSujeito = document.getElementById('input-file-sujeito');
    const btnUploadSujeito = document.getElementById('btn-upload-sujeito');
    const labelUploadSujeito = document.getElementById('label-upload-sujeito');
    btnUploadSujeito.onclick = () => inputFileSujeito.click();
    inputFileSujeito.onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        labelUploadSujeito.textContent = file.name;
        const reader = new FileReader();
        reader.onload = () => {
          mainImageBase64 = reader.result;
          showToast('Imagem principal carregada!', 'success');
        };
        reader.readAsDataURL(file);
      }
    };

    const inputFileRef = document.getElementById('input-file-ref');
    const btnUploadRef = document.getElementById('btn-upload-ref');
    const labelUploadRef = document.getElementById('label-upload-ref');
    btnUploadRef.onclick = () => inputFileRef.click();
    inputFileRef.onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        labelUploadRef.textContent = file.name;
        const reader = new FileReader();
        reader.onload = () => {
          refImageBase64 = reader.result;
          showToast('Inspiração de estilo carregada!', 'success');
        };
        reader.readAsDataURL(file);
      }
    };

    // 5. Close Publish alert
    const btnClosePublishAlert = document.getElementById('btn-close-publish-alert');
    const publishAlert = document.getElementById('publish-alert');
    if (btnClosePublishAlert && publishAlert) {
      btnClosePublishAlert.onclick = () => {
        publishAlert.style.display = 'none';
      };
    }

    // 6. Guia Dropdown Menu
    const btnGuia = document.getElementById('btn-guia');
    const guiaMenu = document.getElementById('guia-menu');
    if (btnGuia && guiaMenu) {
      btnGuia.onclick = (e) => {
        e.stopPropagation();
        const rect = btnGuia.getBoundingClientRect();
        guiaMenu.style.top = (rect.bottom + 6) + 'px';
        guiaMenu.style.left = (rect.right - 216) + 'px';
        guiaMenu.classList.toggle('hidden');
      };
      document.addEventListener('click', () => {
        guiaMenu.classList.add('hidden');
      });
    }

    // 7. Fullscreen Dialog Viewer
    const viewerContainer = document.getElementById('viewer-container');
    const fullscreenDialog = document.getElementById('fullscreen-dialog');
    const btnCloseFullscreen = document.getElementById('btn-close-fullscreen');
    const fullscreenImage = document.getElementById('fullscreen-image');
    const mainResultViewer = document.getElementById('main-result-viewer');

    if (viewerContainer && fullscreenDialog) {
      viewerContainer.onclick = () => {
        fullscreenImage.src = mainResultViewer.src;
        fullscreenDialog.style.opacity = '1';
        fullscreenDialog.style.pointerEvents = 'auto';
      };
      btnCloseFullscreen.onclick = () => {
        fullscreenDialog.style.opacity = '0';
        fullscreenDialog.style.pointerEvents = 'none';
      };
    }

    // Fullscreen zoom
    const fsZoomIn = document.getElementById('fs-zoom-in');
    const fsZoomOut = document.getElementById('fs-zoom-out');
    const fsZoomReset = document.getElementById('fs-zoom-reset');
    const fsZoomVal = document.getElementById('fs-zoom-val');
    if (fsZoomIn) {
      fsZoomIn.onclick = () => {
        fsZoom = Math.min(300, fsZoom + 25);
        applyFsZoom();
      };
      fsZoomOut.onclick = () => {
        fsZoom = Math.max(50, fsZoom - 25);
        applyFsZoom();
      };
      fsZoomReset.onclick = () => {
        fsZoom = 100;
        applyFsZoom();
      };
    }
    function applyFsZoom() {
      if (fullscreenImage) fullscreenImage.style.transform = 'scale(' + (fsZoom / 100) + ')';
      if (fsZoomVal) fsZoomVal.textContent = fsZoom + '%';
    }

    // 8. Magic Bar Refine & Textarea expand
    const campoDeRefino = document.getElementById('campo-de-refino');
    const btnSendRefine = document.getElementById('btn-send-refine');
    if (campoDeRefino && btnSendRefine) {
      campoDeRefino.addEventListener('input', () => {
        const val = campoDeRefino.value.trim();
        btnSendRefine.disabled = !val;
        if (val) {
          btnSendRefine.classList.remove('bg-white/[0.06]', 'text-zinc-600', 'cursor-not-allowed');
          btnSendRefine.classList.add('bg-violet-600', 'text-white', 'shadow-lg', 'shadow-violet-600/30');
        } else {
          btnSendRefine.classList.add('bg-white/[0.06]', 'text-zinc-600', 'cursor-not-allowed');
          btnSendRefine.classList.remove('bg-violet-600', 'text-white', 'shadow-lg', 'shadow-violet-600/30');
        }
      });
      btnSendRefine.onclick = () => {
        const text = campoDeRefino.value.trim();
        if (!text) return;
        showToast('Enviando alteração mágica: "' + text + '"...', 'info');
        campoDeRefino.value = '';
        btnSendRefine.disabled = true;
        btnSendRefine.classList.add('bg-white/[0.06]', 'text-zinc-600', 'cursor-not-allowed');
        btnSendRefine.classList.remove('bg-violet-600', 'text-white', 'shadow-lg', 'shadow-violet-600/30');
      };
    }

    // 9. Construir Action -> calls /api/gerar
    const btnConstruir = document.getElementById('btn-construir');
    const btnConstruirText = document.getElementById('btn-construir-text');
    const btnConstruirSpinner = document.getElementById('btn-construir-spinner');

    btnConstruir.onclick = async () => {
      const descricao = document.getElementById('descricao_adicional').value;
      const prompt = (descricao ? descricao + '. ' : '') + 'Alta definição, estúdio profissional, iluminação cinematográfica, 8k, proporção ' + currentDimension;

      btnConstruir.disabled = true;
      btnConstruirSpinner.classList.remove('hidden');
      btnConstruirText.textContent = 'Construindo...';

      try {
        const res = await fetch('/api/gerar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: prompt,
            dimension: currentDimension,
            quality: currentQuality,
            subject_position: currentAlignment,
            agent: 'ref'
          })
        });
        const data = await res.json();
        const newImgUrl = data.imageUrl || data.url || data.result;
        if (newImgUrl) {
          mainResultViewer.src = newImgUrl;
          showToast('Arte construída com sucesso!', 'success');
          
          // Adiciona ao histórico lateral
          const container = document.getElementById('historico-items-container');
          if (container) {
            const item = document.createElement('div');
            item.setAttribute('data-media-window', 'mounted');
            item.className = 'w-full [content-visibility:auto] [contain-intrinsic-size:auto_400px]';
            item.innerHTML = `
              <div class="group relative w-full overflow-hidden rounded-lg border transition-all duration-200 border-violet-500/50 shadow-[0_0_8px_rgba(139,92,246,0.2)]">
                <button type="button" class="block w-full" onclick="document.getElementById('main-result-viewer').src='${newImgUrl}'">
                  <img alt="" class="aspect-square w-full object-cover cursor-grab" src="${newImgUrl}">
                </button>
                <div class="pointer-events-none absolute left-1 top-1 z-10 flex items-center rounded border px-1 py-0.5 text-[8px] font-semibold leading-none shadow-sm backdrop-blur-sm opacity-0 transition-opacity duration-150 group-hover:opacity-100 border-violet-400/30 bg-violet-950/85 text-violet-200">
                  <span>Geração</span>
                </div>
                <button type="button" onclick="this.closest('[data-media-window]').remove()" class="absolute right-1 top-1 z-10 flex h-6 w-6 items-center justify-center rounded-md bg-black/70 text-zinc-300 ring-1 ring-white/10 backdrop-blur-sm opacity-0 transition-opacity group-hover:opacity-100 hover:bg-red-500/30 hover:text-red-300">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash2 h-3 w-3"><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
              </div>
            `;
            container.insertBefore(item, container.firstChild);
          }
        } else {
          showToast('Erro ao gerar: ' + (data.error || 'Tente novamente'), 'error');
        }
      } catch (err) {
        console.error(err);
        showToast('Falha na requisição de geração', 'error');
      } finally {
        btnConstruir.disabled = false;
        btnConstruirSpinner.classList.add('hidden');
        btnConstruirText.textContent = 'Construir';
      }
    };

    // 10. Floating Actions (Report, Reuse, Fav, Publish, Format, Export, Base)
    document.getElementById('btn-action-report').onclick = () => showToast('Reportar geração aberto', 'info');
    document.getElementById('btn-action-reuse').onclick = () => showToast('Configurações reutilizadas no formulário', 'info');
    document.getElementById('btn-action-fav').onclick = () => {
      isFavorited = !isFavorited;
      const favIcon = document.getElementById('fav-icon');
      if (isFavorited) {
        favIcon.setAttribute('fill', '#ef4444');
        favIcon.setAttribute('stroke', '#ef4444');
        showToast('Adicionado aos favoritos!', 'success');
      } else {
        favIcon.setAttribute('fill', 'none');
        favIcon.setAttribute('stroke', 'currentColor');
        showToast('Removido dos favoritos', 'info');
      }
    };
    document.getElementById('btn-action-publish').onclick = () => showToast('Modal de publicação na Comunidade aberto', 'info');
    document.getElementById('btn-banner-publish').onclick = () => showToast('Publicação na comunidade iniciada!', 'success');
    document.getElementById('btn-action-format').onclick = () => showToast('Opções de formato ativadas', 'info');
    document.getElementById('btn-action-export').onclick = () => {
      fullscreenImage.src = mainResultViewer.src;
      fullscreenDialog.style.opacity = '1';
      fullscreenDialog.style.pointerEvents = 'auto';
    };
    document.getElementById('btn-action-base').onclick = () => {
      mainImageBase64 = mainResultViewer.src;
      labelUploadSujeito.textContent = 'Imagem base selecionada';
      showToast('Imagem atual definida como Sujeito Principal!', 'success');
    };
  </script>
</body>
</html>

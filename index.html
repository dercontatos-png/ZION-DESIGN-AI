<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&family=Unbounded:wght@400;600;800&family=Cinzel:wght@400;700&family=Outfit:wght@400;600;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <title>My Google AI Studio App</title>
    <script>
      try {
        let nativeFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get: function() { return nativeFetch; },
          set: function(val) { nativeFetch = val; },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        console.warn("Could not redefine window.fetch, environment may be read-only:", e);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

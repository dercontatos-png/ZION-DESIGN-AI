<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #111; color: white; font-family: sans-serif; }
    .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; padding: 20px; }
    .card { background: #222; border-radius: 8px; overflow: hidden; padding: 8px; text-align: center; }
    img { width: 100%; height: 180px; object-fit: cover; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>All Hydra Thumbnails</h1>
  <div class="grid" id="grid"></div>
  <script>
    const grid = document.getElementById('grid');
    const list = [
      'thumbnail.webp',
      ...Array.from({length: 23}, (_, i) => `thumbnail(${i+1}).webp`)
    ];
    list.forEach(name => {
      const d = document.createElement('div');
      d.className = 'card';
      d.innerHTML = `<img src="/hydra_files/${name}"><div>${name}</div>`;
      grid.appendChild(d);
    });
  </script>
</body>
</html>
